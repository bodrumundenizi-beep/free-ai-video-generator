<!doctype html><html><head><meta charset="utf-8">
<!-- A tutorial video's page (5.4). Every frame is a pure function of time: seek(t). All numbers
     come from timeline.js (window.TIMELINE, written by vidgen/tutorial/__init__.py); the look and
     motion are the house style of tests/fixtures/tutorial_ref (HOUSE_STYLE.md). -->
<style>
:root{--accent:#E8763A;--on-accent:#1A0D05;--font:'Segoe UI';--panel:rgba(24,24,24,.9);--panel-text:#f0f0f0;--panel-edge:rgba(255,255,255,.14)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0a0a0a;font-family:var(--font)}
/* 9:16 for Shorts: the steps on top, the words lower, the Done card under the window */
body.tall .dots{right:auto;left:48px;top:118px}
body.tall .step{left:48px;top:44px;flex-wrap:wrap;max-width:980px}
body.tall #cap{bottom:240px;white-space:normal;width:max-content;max-width:940px;text-align:center;font-size:50px;line-height:1.45}
body.tall #cap em{white-space:nowrap}   /* a highlighted name never breaks in two */
body.tall #title h1{font-size:72px;text-align:center;max-width:960px}
body.tall #recap{right:auto;left:50%;top:auto;bottom:200px}
.back{position:absolute;inset:-80px;background-position:center;background-size:cover;filter:blur(44px) brightness(.42) saturate(1.1)}
.blob{position:absolute;border-radius:50%;background:var(--accent);opacity:.16;filter:blur(130px)}
#cam{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:10px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}
#cam img{position:absolute;inset:0;width:100%;height:100%;opacity:0}
/* the real recording: its margin is see-through, so the shadow follows the window and menus */
#cam.live{border-radius:0;overflow:visible;box-shadow:none}
#cam.live img{filter:drop-shadow(0 40px 50px rgba(0,0,0,.6))}
/* fast: the same look without filters redrawn every frame (frames 3x quicker, 2026-11-14):
   a backdrop blurred beforehand, gradient blobs, a plain shadow behind the window */
body.fast .back{filter:none}
body.fast .blob{filter:none;opacity:.32;background:radial-gradient(circle,var(--accent) 0%,transparent 68%)}
body.fast #cam.live img{filter:none}
#shade{position:absolute;border-radius:10px;box-shadow:0 40px 100px rgba(0,0,0,.65);display:none}
body.fast #shade{display:block}
#draw{position:absolute;z-index:3;border:2px solid transparent;opacity:0}
#spot{position:absolute;inset:0;pointer-events:none}
.ring{position:absolute;border:4px solid var(--accent);border-radius:50%;opacity:0;box-shadow:0 0 24px var(--accent)}
#cursor{position:absolute;width:40px;height:52px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
#callout{position:absolute;background:var(--panel);border:1px solid var(--panel-edge);border-radius:8px;
  padding:14px 22px;color:var(--panel-text);font:600 30px var(--font);box-shadow:0 18px 40px rgba(0,0,0,.45);opacity:0;white-space:nowrap}
#callout:after{content:"";position:absolute;left:50%;top:-9px;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:var(--panel)}
.step{position:absolute;left:64px;top:52px;display:flex;gap:16px;align-items:center;opacity:0}
.pill{background:var(--accent);color:var(--on-accent);font:600 26px var(--font);padding:9px 18px;border-radius:6px}
.stitle{color:var(--panel-text);font:600 30px var(--font);background:var(--panel);padding:7px 16px;border-radius:6px}
.dots{position:absolute;right:64px;top:62px;display:flex;gap:10px;opacity:0;background:var(--panel);padding:12px 14px;border-radius:6px}
.dots b{width:44px;height:6px;border-radius:2px;background:rgba(255,255,255,.2)}
.dots b.on{background:var(--accent)}
#cap{position:absolute;left:50%;bottom:64px;background:var(--panel);border-radius:8px;padding:18px 34px;color:var(--panel-text);
  font:600 44px var(--font);white-space:nowrap;opacity:0}
#cap em{font-style:normal;color:var(--on-accent);background:var(--accent);border-radius:4px;padding:0 10px}
.bar{position:absolute;left:0;bottom:0;height:7px;width:100%;background:rgba(255,255,255,.07)}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;
  background:rgba(8,8,8,.55)}
#title h1{margin:0;color:#fff;font:700 76px var(--font);letter-spacing:-1px}
#title p{margin:0;color:#c9c9c9;font:400 34px var(--font)}
#title .tag{background:var(--accent);color:var(--on-accent);font:600 26px var(--font);padding:8px 18px;border-radius:6px}
#recap{position:absolute;right:110px;top:50%;transform:translateY(-50%);background:var(--panel);border-radius:10px;
  padding:36px 44px;color:var(--panel-text);opacity:0;box-shadow:0 30px 70px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1)}
#recap h2{margin:0 0 22px;font:700 44px var(--font)}
#recap div{font:400 30px var(--font);margin:14px 0;display:flex;gap:16px;align-items:center;opacity:0}
#recap div b{width:38px;height:38px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;
  justify-content:center;font:700 26px var(--font)}
</style></head><body>
<div class="back" id="back"></div>
<div class="blob" style="left:1350px;top:-250px;width:760px;height:760px"></div>
<div class="blob" style="left:-260px;top:720px;width:640px;height:640px"></div>
<div id="cam"><div id="draw"></div></div>
<canvas id="spot" width="1920" height="1080"></canvas>
<div class="ring" id="r1"></div><div class="ring" id="r2"></div>
<svg id="cursor" viewBox="0 0 22 28"><path d="M1 1v22l6-5 4 9 4-2-4-8h8z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>
<div id="callout"></div>
<div class="step" id="step"><span class="pill" id="pill"></span><span class="stitle" id="stitle"></span></div>
<div class="dots" id="dots"></div>
<div id="cap"></div>
<div class="bar"><i id="prog"></i></div>
<div id="title"><span class="tag" id="ttag"></span><h1 id="th1"></h1><p id="tsub"></p></div>
<div id="recap"><h2 id="rh2"></h2></div>
<script src="timeline.js"></script>
<script>
const L = window.TIMELINE;
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3);
const clamp = x => Math.max(0, Math.min(1, x));
function track(keys, t) {           // keys: [t, ...values]; eased between neighbours
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const a = keys[i-1], b = keys[i], k = ease((t - a[0]) / (b[0] - a[0]));
    return a.slice(1).map((v, j) => v + (b[j+1] - v) * k);
  }
  return keys[keys.length-1].slice(1);
}
const $ = id => document.getElementById(id);
const el = (tag, parent, text) => { const e = document.createElement(tag); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
// **words** become highlighted; everything else is plain text (no HTML from the timeline)
function marked(parent, text) {
  parent.textContent = '';
  String(text).split('**').forEach((part, i) => { if (part) (i % 2 ? el('em', parent, part) : parent.appendChild(document.createTextNode(part))); });
}
// --- build the page from the timeline ---
const root = document.documentElement.style;
root.setProperty('--accent', L.look.accent); root.setProperty('--on-accent', L.look.on_accent);
root.setProperty('--font', `'${L.look.font}'`);
if (L.look.theme === 'light') {   // a light app: light labels and captions, like its own
  root.setProperty('--panel', 'rgba(250,250,250,.94)'); root.setProperty('--panel-text', '#1b1b1b');
  root.setProperty('--panel-edge', 'rgba(0,0,0,.12)');
}
const cam = $('cam'), CX = L.stage.centre[0], CY = L.stage.centre[1];
const [W, H] = L.stage.size || [1920, 1080], TALL = !!L.stage.tall;
document.documentElement.style.width = document.body.style.width = W + 'px';
document.documentElement.style.height = document.body.style.height = H + 'px';
$('spot').width = W; $('spot').height = H;
if (TALL) document.body.classList.add('tall');
cam.style.width = L.window.w + 'px'; cam.style.height = L.window.h + 'px';
const F = L.frames || null;   // the recording, one picture per frame (plan step 4)
const frameName = k => F.pattern.replace('%05d', String(k).padStart(5, '0'));
const screens = F ? [] : L.screens;
$('back').style.backgroundImage = `url("${F ? frameName(0) : screens[0].image}")`;
const shots = screens.map(s => { const i = document.createElement('img'); i.src = s.image; cam.insertBefore(i, $('draw')); return i; });
let live = null;
if (F) {
  cam.classList.add('live');
  if (F.back && F.window) {
    document.body.classList.add('fast');
    $('back').style.backgroundImage = `url("${F.back}")`;
    const shade = document.createElement('div'); shade.id = 'shade';
    const [wx, wy, ww, wh] = F.window;
    Object.assign(shade.style, {left: wx + 'px', top: wy + 'px', width: ww + 'px', height: wh + 'px'});
    cam.insertBefore(shade, cam.firstChild);
  }
  live = document.createElement('img'); live.style.opacity = 1; live.src = frameName(0);
  cam.insertBefore(live, $('draw'));
  shots.push(live);
}
const steps = L.steps, STEPS_N = steps.length;
for (let i = 0; i < STEPS_N; i++) el('b', $('dots'));
$('stitle').textContent = L.title.title;
$('ttag').textContent = L.title.tag; $('th1').textContent = L.title.title; $('tsub').textContent = L.title.sub;
$('rh2').textContent = L.recap.title;
L.recap.rows.forEach((row, i) => { const d = el('div', $('recap')); el('b', d, String(i + 1)); d.appendChild(document.createTextNode(row)); });
const spot = $('spot').getContext('2d');
let view = [0, 0, 1];
function toScreen(x, y) { return [CX + (x - view[0]) * view[2], CY + (y - view[1]) * view[2]]; }
window.seek = function (t) {
  view = track(L.camera, t);
  cam.style.transform = `translate(${CX - view[0]*view[2]}px,${CY - view[1]*view[2]}px) scale(${view[2]})`;
  // the recording's frame, or the stills crossfading
  let loaded = null;
  if (F) {
    const name = frameName(Math.min(F.count - 1, Math.floor(t * F.fps + 1e-6)));
    if (!live.src.endsWith(name)) {
      loaded = new Promise(r => { live.onload = r; live.onerror = r; });
      live.src = name;
    }
  } else {
    let cur = 0, prev = null, since = 99;
    screens.forEach((s, i) => { if (t >= s.at) { prev = cur; cur = i; since = t - s.at; } });
    shots.forEach(s => { s.style.opacity = 0; s.style.zIndex = 0; });
    const f = clamp(since / L.style.crossfade), fading = prev !== null && shots[prev] !== shots[cur]
      && screens[prev].image !== screens[cur].image && f < 1;
    if (fading) { shots[prev].style.opacity = 1; shots[prev].style.zIndex = 1; }
    shots[cur].style.opacity = fading ? f : 1; shots[cur].style.zIndex = 2;
  }
  // a shape being dragged out
  const d = $('draw'); d.style.opacity = 0;
  for (const g of L.drags) {
    if (t < g.from || t >= g.until || !g.fill) continue;   // the recording shows the real shape
    const p = track(L.cursor, t); d.style.opacity = 1;
    d.style.background = g.fill; d.style.borderColor = g.edge;
    d.style.left = g.x + 'px'; d.style.top = g.y + 'px';
    d.style.width = Math.max(0, p[0] - g.x) + 'px'; d.style.height = Math.max(0, p[1] - g.y) + 'px';
  }
  // cursor
  const c = track(L.cursor, t), cs = toScreen(c[0], c[1]);
  const press = L.clicks.some(k => t >= k[0] && t < k[0] + L.style.press)
    || L.drags.some(g => t >= g.from && t < g.press_until);
  $('cursor').style.left = cs[0] - 3 + 'px'; $('cursor').style.top = cs[1] - 2 + 'px';
  $('cursor').style.transform = press ? 'scale(.86)' : 'none';
  // click rings
  const rings = [$('r1'), $('r2')]; rings.forEach(r => r.style.opacity = 0);
  for (const [k, x, y] of L.clicks) {
    const a = (t - k) / L.style.ring; if (a < 0 || a > 1) continue;
    const [sx, sy] = toScreen(x, y);
    rings.forEach((r, i) => { const e = clamp(a * (i ? 1.3 : 1)); const size = 30 + 110 * out(e);
      r.style.width = r.style.height = size + 'px'; r.style.left = sx - size/2 + 'px'; r.style.top = sy - size/2 + 'px';
      r.style.opacity = (1 - e) * (i ? .5 : .9); });
  }
  // callout + spotlight
  spot.clearRect(0, 0, W, H);
  const co = $('callout'); co.style.opacity = 0;
  for (const [a, b, x, y, text] of L.callouts) {
    if (t < a || t > b) continue;
    const v = Math.min(clamp((t - a) / .2), clamp((b - t) / .2));
    const [sx, sy] = toScreen(x, y);
    co.textContent = text; co.style.opacity = v;
    co.style.left = sx - co.offsetWidth / 2 + 'px'; co.style.top = sy + 46 + (1 - out(v)) * 14 + 'px';
    const g = spot.createRadialGradient(sx, sy, 60, sx, sy, 520);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${L.style.spotlight * v})`);
    spot.fillStyle = g; spot.fillRect(0, 0, W, H);
  }
  // step, caption, progress
  let st = -1; steps.forEach((s, i) => { if (t >= s.at) st = i; });
  const inMain = t >= L.main[0] && t < L.main[1];
  $('step').style.opacity = $('dots').style.opacity = inMain ? clamp((t - L.main[0]) / .3) : 0;
  const cap = $('cap');
  if (st >= 0 && inMain) {
    $('pill').textContent = `Step ${st + 1} of ${STEPS_N}`;
    [...$('dots').children].forEach((b, i) => b.className = i <= st ? 'on' : '');
    if (cap.dataset.step !== String(st)) { marked(cap, steps[st].text); cap.dataset.step = st; }
    const v = clamp((t - steps[st].at) / .3);
    cap.style.opacity = v; cap.style.transform = `translateX(-50%) translateY(${(1 - out(v)) * 20}px)`;
  } else cap.style.opacity = 0;
  $('prog').style.width = (t / L.length * 100) + '%';
  // title and recap
  const until = L.title.until;
  $('title').style.opacity = t < until ? Math.min(clamp(t / .3), clamp((until - t) / .3)) : 0;
  const rc = $('recap'), rv = clamp((t - L.recap.at) / .4);
  rc.style.opacity = rv;
  rc.style.transform = TALL ? `translateX(-50%) translateY(${(1 - out(rv)) * 40}px)`
                            : `translateY(-50%) translateX(${(1 - out(rv)) * 40}px)`;
  [...rc.querySelectorAll('div')].forEach((row, i) => row.style.opacity = clamp((t - L.recap.at - .3 - i * .3) / .3));
  return loaded;   // browser.record waits for the frame's picture before taking the shot
};
window.promoReady = false;   // the name browser.open() waits for
Promise.all([document.fonts.ready, ...shots.map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))])
  .then(() => { seek(0); window.promoReady = true; });
</script></body></html>
